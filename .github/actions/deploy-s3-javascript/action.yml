name: Deploy to AWS S3
description: Deploying (static) website files to AWS S3.
inputs:
  bucket:
    description: The S3 bucket name.
    required: true
  bucket-region:
    decription: Region of used S3 bucket.
    required: false
    default: eu-north-1
  dist-folder:
    description: Path to folder containing website files. 
    required: true
outputs:
  website-url:
    description: The URL of the deployed website.

runs:
  using: node16
  main: main.js
